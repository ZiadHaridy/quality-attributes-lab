name: ride-lab

x-matching: &matching
  build: .
  image: ride-lab
  command: ["node", "matching.js"]
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 2s
    timeout: 1s
    retries: 2

services:
  matching-a:
    <<: *matching
    container_name: matching-a
    environment:
      NAME: matching-a

  matching-b:
    <<: *matching
    container_name: matching-b
    environment:
      NAME: matching-b

  gateway:
    build: .
    image: ride-lab
    container_name: gateway
    command: ["node", "gateway.js"]
    environment:
      MODE: ${MODE:-hot}
      IMAGE: ride-lab
      NETWORK: ride-lab-net
      UV_THREADPOOL_SIZE: 64 # lookups of a dead container's name are slow on Docker Desktop
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - matching-a
      - matching-b

networks:
  default:
    name: ride-lab-net
